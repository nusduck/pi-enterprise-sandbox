[project]
name = "biz-db-mcp"
version = "0.1.0"
description = "MCP server exposing read-only business MySQL access (query/describe_table/export) without exposing credentials to the Sandbox execution plane."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pymysql>=1.1.0",
  "sqlparse>=0.5.0",
  "pyarrow>=17.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
biz-db-mcp = "biz_db_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
