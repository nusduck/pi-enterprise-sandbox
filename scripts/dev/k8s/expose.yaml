# dev 模式专用：OrbStack 把 LoadBalancer 映射到宿主 127.0.0.1（k8s.expose_services=false 时不对局域网开放），
# 端口与 Compose 开发栈一致，浏览器和本地脚本不用改地址。
apiVersion: v1
kind: Service
metadata: { name: frontend-lb, namespace: __NS__ }
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ name: http, port: __FRONTEND_PORT__, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: api-server-lb, namespace: __NS__ }
spec:
  type: LoadBalancer
  selector: { app: api-server }
  ports: [{ name: http, port: __API_PORT__, targetPort: 4000 }]
---
apiVersion: v1
kind: Service
metadata: { name: agent-lb, namespace: __NS__ }
spec:
  type: LoadBalancer
  selector: { app: agent }
  ports: [{ name: http, port: __AGENT_PORT__, targetPort: 4100 }]
---
apiVersion: v1
kind: Service
metadata: { name: sandbox-mcp-lb, namespace: __NS__ }
spec:
  type: LoadBalancer
  selector: { app: sandbox-mcp }
  ports: [{ name: http, port: __MCP_PORT__, targetPort: 8082 }]
