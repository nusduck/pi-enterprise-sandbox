# 我们的组合层——叠在 dsh-base 之上。
#
# ⚠️ **这个文件是生成的，不要手改。** 事实源是 `src/plugins/manifest.ts`；
#    改完跑 `npm run gen:patch`，`plugins.test.ts` 会断言两者一致。
#
# 为什么要生成而不是手写：patch 能静默写错，而写错时没有任何人报错——插件装不上
# 就是出厂实现留在原位。2026-08-30 一天内踩到两种：
#   1. 在已有行上改 `name` 想替换插件。dsh-app-boot 把 `name` 当**断言**，
#      不匹配就整条跳过，于是 ctx.credentials 一直是出厂的 LocalCredentialProvider
#      ——ADR 0007「必须移除的行」点名不得组合的那个。
#   2. `name` 指向 `../src/*.js`，而源码是 .ts、产物在 dist/。
# manifest.ts 让这两种都写不出来（替换只有 replaceFactory() 一个入口）。

# 凭据：只读环境变量实现替换 dsh-credentials-local。出厂那个没有租户维度，
# 且热重载设置文件——多租户下是配置漂移面（ADR 0007「必须移除的行」）。
- id: credentials
  disabled: true

- insert:
    - id: enterprise-credentials
      name: '../providers/env-credentials.js'
      config: {}

# 模型目录：固定路由名 deepseek-official（包自占），指向自有网关，协议与官方一致。
- id: llm-deepseek
  config:
    apiKeyEnv: LLMIO_API_KEY
    baseURL: !!js (process.env.LLMIO_BASE_URL || process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com')
    defaultContextWindow: 262144
    models:
      - id: deepseek-v4-flash
        name: 'DeepSeek V4 Flash'
        contextWindow: 262144
      - id: deepseek-v4-pro
        name: 'DeepSeek V4 Pro'
        contextWindow: 262144
        reasoning: true
      - id: private-reasoner
        description: 'Company-hosted reasoning model'
        contextWindow: 512000
        reasoning: true

# 本机执行族一律不挂（ADR 0007 D11）：Bubblewrap 在 exec 进程里，
# 不在 agent 进程里。
- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: subprocess
  disabled: true

- id: jobs
  disabled: true

- id: tool-pwsh
  disabled: true

# tool-fs-search 依赖本机 subprocess + ripgrep；搜索由 exec 的 /internal/v1/fs/* 承担。
- id: tool-fs-search
  disabled: true

# 不组合 dsh-permission-presets：process-level、无租户维度；
# 隔离权威是 Bubblewrap / exec，不是 DSH 本机围栏（ADR 0009 D5）。
- id: permission
  disabled: true

# 关掉本机 JSONL 会话落盘。MySQL PersistenceBackend 由
# boot.createSessionBackend 按 Run 装配。
- id: session-persistence-jsonl
  disabled: true

- id: session-checkpoint-policy
  disabled: true

- id: session-query-sqlite
  disabled: true

# 出网面不进 agent 进程：`web_search` 让模型直接联网，而
# plan.md §12 要求业务数据只经受控的数据库 MCP。
- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

# `workflow` 在本进程 worker thread 里跑 JS 编排子 Agent
# ——那是本机执行面，ADR 0007 D11 不挂。
- id: tool-workflow
  disabled: true

- id: workflow-worker-thread
  disabled: true

# `ralph` 是朝一个不可变目标反复重试的自主循环，不受每 Run
# 预算与账本约束，不在本阶段范围。
- id: tool-ralph
  disabled: true

# 子 Agent 只有 durable one-shot 一种形态
# （subagent-spawn-in-process 已关）。fork 与 control 面都要求可续聊的
# same-process 子 Agent，与我们的 provider 对不上。
- id: tool-subagent-fork
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

# goal 三件套是会话内目标状态机：没有企业面、没有前端卡片、
# 没有风险表条目。与 memory 同理（D10），本阶段不做。
- id: tool-goal
  disabled: true

# plan mode 的交接工具同上。
- id: plan-mode
  disabled: true

# 与 read/write/edit 功能重复的第二套编辑工具。
# 留着就是「同一件事两处各算一遍」，且要在风险表里维护两份条目。
- id: tool-str-replace-editor
  disabled: true

# 远程 fs/shell/jobs 以 Cordis 插件提供服务，这样 tool-bash / tool-fs 才能在
# boot 时等到 fs/shell/jobs 并激活。本机执行族全部关闭（下方 DISABLED）。
- insert:
    - id: remote-fs
      name: '../providers/remote-fs.js'
      config: {}
    - id: remote-shell
      name: '../providers/remote-shell.js'
      config: {}
    - id: remote-jobs
      name: '../providers/remote-jobs.js'
      config: {}

# glob / grep：注册名与出厂 dsh-tool-fs-search 逐字一致，执行改走 exec 的
# /internal/v1/fs/{find,grep}（ADR 0009 D8）。出厂那个要本机 subprocess + ripgrep，
# 而本机执行族一律不挂（ADR 0007 D11）——不为它单独恢复 subprocess。
# 名字抄出厂是为了：将来若换回出厂实现，风险表 / tool-risk.json / 前端一处都不用改。
- insert:
    - id: remote-fs-search
      name: '../providers/remote-fs-search.js'
      config: {}

# ask_user_question：dsh-base 只带 dsh-user-questions 这个 seam（ctx.userQuestions），
# **没有带对应的工具**，所以模型今天问不了人。这个包是那个 seam 的 Consumer，
# 注册名 ask_user_question（ADR 0009 D3 的两个缺口之一）。
# 停泊/续跑仍由 application 承担：WAITING_INPUT + 现有应答 API + 重放。
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
      config: {}

# submit_artifact：ADR 0009 D4 说「我们自建的，保留」，但 2026-08-31 起栈实测
# 发现**根本没有插件注册它**——旧 Pi Extension 删除后没补，能力静默缺失了。
# 补回来而不是按退役处理：exec 侧 /internal/v1/artifacts/submit 一直都在。
- insert:
    - id: submit-artifact
      name: '../providers/submit-artifact.js'
      config: {}

# 子 Agent：原生 trusted same-process 对不上，退回 durable 队列面。
- id: subagent-spawn-in-process
  disabled: true

- insert:
    - id: enterprise-durable-subagent
      name: '../providers/durable-subagent.js'
      config:
        providerName: spawn

# tool-subagent 退回 one-shot：base 配的 `continuable` 要求 provider 实现
# `prepareContinuable`（子会话可再开后续轮次），而我们的 durable provider 是
# 一次性作业（start → BullMQ → 轮询 → 结算，跨 Worker 可恢复，没有"续聊"）。
# 这是 ADR 0007 残余风险清单里那条的预案：对不上就退回，只丢工具层的模型体验
# ——具体丢的是"对同一个子 Agent 追加消息"，后台执行本身仍在。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
