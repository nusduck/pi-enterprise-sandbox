# 我们的组合层——叠在 dsh-base 之上。
#
# ⚠️ **这个文件是生成的，不要手改。** 事实源是 `src/plugins/manifest.ts`；
#    改完跑 `npm run gen:patch`，`plugins.test.ts` 会断言两者一致。
#
# 为什么要生成而不是手写：patch 能静默写错，而写错时没有任何人报错——插件装不上
# 就是出厂实现留在原位。2026-08-30 一天内踩到两种：
#   1. 在已有行上改 `name` 想替换插件。dsh-app-boot 把 `name` 当**断言**，
#      不匹配就整条跳过，于是 ctx.credentials 一直是出厂的 LocalCredentialProvider
#      ——ADR 0007「必须移除的行」点名不得组合的那个。
#   2. `name` 指向 `../src/*.js`，而源码是 .ts、产物在 dist/。
# manifest.ts 让这两种都写不出来（替换只有 replaceFactory() 一个入口）。

# 凭据：只读环境变量实现替换 dsh-credentials-local。出厂那个没有租户维度，
# 且热重载设置文件——多租户下是配置漂移面（ADR 0007「必须移除的行」）。
- id: credentials
  disabled: true

- insert:
    - id: enterprise-credentials
      name: '../providers/env-credentials.js'
      config: {}

# 模型目录：固定路由名 deepseek-official（包自占），指向自有网关，协议与官方一致。
- id: llm-deepseek
  config:
    apiKeyEnv: LLMIO_API_KEY
    baseURL: !!js (process.env.LLMIO_BASE_URL || process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com')
    defaultContextWindow: 262144
    models:
      - id: deepseek-v4-flash
        name: 'DeepSeek V4 Flash'
        contextWindow: 262144
      - id: deepseek-v4-pro
        name: 'DeepSeek V4 Pro'
        contextWindow: 262144
        reasoning: true
      - id: private-reasoner
        description: 'Company-hosted reasoning model'
        contextWindow: 512000
        reasoning: true

# 本机执行族一律不挂（ADR 0007 D11）：Bubblewrap 在 exec 进程里，
# 不在 agent 进程里。
- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: subprocess
  disabled: true

- id: jobs
  disabled: true

- id: tool-pwsh
  disabled: true

# tool-fs-search 依赖本机 subprocess + ripgrep；搜索由 exec 的 /internal/v1/fs/* 承担。
- id: tool-fs-search
  disabled: true

# 不组合原生审批/权限预设（ADR 0007 D4）；企业策略走
# `policy/install.ts` 的四个挂载点。
- id: approval
  disabled: true

- id: permission
  disabled: true

# 关掉本机 JSONL 会话落盘。MySQL PersistenceBackend 由
# boot.createSessionBackend 按 Run 装配。
- id: session-persistence-jsonl
  disabled: true

- id: session-checkpoint-policy
  disabled: true

- id: session-query-sqlite
  disabled: true

# 远程 fs/shell/jobs 以 Cordis 插件提供服务，这样 tool-bash / tool-fs 才能在
# boot 时等到 fs/shell/jobs 并激活。本机执行族全部关闭（下方 DISABLED）。
- insert:
    - id: remote-fs
      name: '../providers/remote-fs.js'
      config: {}
    - id: remote-shell
      name: '../providers/remote-shell.js'
      config: {}
    - id: remote-jobs
      name: '../providers/remote-jobs.js'
      config: {}

# 子 Agent：原生 trusted same-process 对不上，退回 durable 队列面。
- id: subagent-spawn-in-process
  disabled: true

- insert:
    - id: enterprise-durable-subagent
      name: '../providers/durable-subagent.js'
      config:
        providerName: spawn

# tool-subagent 退回 one-shot：base 配的 `continuable` 要求 provider 实现
# `prepareContinuable`（子会话可再开后续轮次），而我们的 durable provider 是
# 一次性作业（start → BullMQ → 轮询 → 结算，跨 Worker 可恢复，没有"续聊"）。
# 这是 ADR 0007 残余风险清单里那条的预案：对不上就退回，只丢工具层的模型体验
# ——具体丢的是"对同一个子 Agent 追加消息"，后台执行本身仍在。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
