# ── Pi Enterprise Sandbox — TLS 入口（TLS_ENABLED=true，默认）───────
# 边缘终止 TLS：80 只做 ACME 与跳转，业务路由全部在 443。
# 由 entrypoint.sh 按 TLS_ENABLED 选中并渲染到 conf.d/sandbox.conf。

# Redirect HTTP → HTTPS
server {
    listen 80 default_server;
    server_name ${DOMAIN};

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ────────────────────────────────────────────────────
server {
    # nginx 1.25.1 起 `listen ... http2` 已废弃（1.27 会告警），改用独立指令。
    listen 443 ssl default_server;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── Security headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/pi-templates/locations.conf;
}
