# ── Pi Enterprise Sandbox — 明文入口（TLS_ENABLED=false）────────────
# 内网部署形态：整条链路在受信内网，或由更外层的平台入口负责加密。
# 由 entrypoint.sh 按 TLS_ENABLED 选中并渲染到 conf.d/sandbox.conf。
#
# 刻意不声明 Strict-Transport-Security：对一个只有明文端口的站点声明 HSTS，
# 会让浏览器在有效期内强制跳转到根本没有监听的加密端口，把入口锁死。
server {
    listen 80 default_server;
    server_name ${DOMAIN};

    # ── Security headers（不含 HSTS，理由见上）────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/pi-templates/locations.conf;
}
