# ── 共享 location 定义 ─────────────────────────────────────────────
# 由 sandbox-http.conf 与 sandbox-tls.conf 的 server 块 include。
# 这里只放路由与代理语义；监听端口、TLS 与 HSTS 由各自的 server 块决定，
# 两种入口形态的路由行为因此不会漂移。
#
# X-Forwarded-Port 用 $server_port 而不是写死 443：同一份 location 在
# 明文模式下由 80 端口的 server 块 include，写死会告诉上游一个假端口。

    # ── Status endpoint (not proxied) ────────────────────────────────
    location /nginx/status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    # ── Static assets (cached, served by frontend Nginx) ─────────────
    location /assets/ {
        limit_req zone=static burst=200 nodelay;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long cache for fingerprinted assets
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Public A2A Agent Card (→ agent:4100) ────────────────────────
    location = /.well-known/agent-card.json {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://agent:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires off;
    }

    # ── A2A JSON-RPC, SSE, cards, and Artifacts (→ agent:4100) ─────
    location ~ ^/a2a(?:/|$) {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 55m;
        proxy_pass http://agent:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $http_authorization;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API + SSE streaming (→ api-server:4000) ─────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        # Explicit override so this location cannot inherit a tighter limit.
        client_max_body_size 55m;
        proxy_pass http://api-server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;

        # SSE streaming: disable buffering for /api/chat
        proxy_buffering off;
        proxy_cache off;
        # Stream large multipart uploads without buffering the full body.
        proxy_request_buffering off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ── Root — SPA from frontend Nginx ───────────────────────────────
    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback: serve index.html for unknown paths
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
