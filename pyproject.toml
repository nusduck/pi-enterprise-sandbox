[project]
name = "pi-enterprise-sandbox"
version = "0.1.0"
description = "Enterprise Sandbox Runtime for Pi Agent — secure execution and governance"
license = {text = "MIT"}
requires-python = ">=3.11,<3.12"
# 2026-08-30：Python 服务代码已全部删除（执行面与 MCP facade 都在 exec/ 里，
# 用 TypeScript）。这个 pyproject 只剩一个用途——跑 tests/ 下的仓库卫生检查
# （布局棘轮、版本钉一致性、compose 安全、SSE 契约夹具）。那些用例只读文件，
# 不 import 任何应用代码，所以运行期依赖为空。
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".runtime/pytest-cache"
