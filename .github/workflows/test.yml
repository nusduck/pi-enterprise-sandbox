name: Test

# Runtime pins: see runtime-versions.json (node.ci / python.ci).
# Consistency enforced by tests/test_runtime_versions.py.

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  contract:
    name: RPC contract (test + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install, typecheck, and test
        run: |
          npm ci --prefix contract
          npm --prefix contract run typecheck
          npm test --prefix contract

  exec:
    name: TypeScript exec (test + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            exec/package-lock.json

      - name: Install and build local contract
        run: |
          npm ci --prefix contract
          npm run build --prefix contract

      - name: Install, typecheck, and test exec
        run: |
          npm ci --prefix exec
          npm --prefix exec run typecheck
          npm test --prefix exec

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project with test extras
        run: uv sync --extra test

      - name: Run pytest
        run: uv run pytest tests/ -q --tb=short

  node-bff:
    name: Node BFF (tests + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api-server/package-lock.json

      - name: Install API Server dependencies
        run: npm ci --prefix api-server

      - name: Typecheck API Server
        run: npm --prefix api-server run typecheck

      - name: Run API Server unit tests
        run: npm test --prefix api-server


  node-agent:
    name: Node Agent (tests + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            contract/package-lock.json

      # agent 通过 file:../contract 引用 @dsh/contract，其 exports 指向 dist/，须先构建。
      - name: Install and build local contract
        run: |
          npm ci --prefix contract
          npm run build --prefix contract

      - name: Install Agent dependencies
        run: npm ci --prefix agent

      - name: Run Agent unit and integration tests
        run: npm test --prefix agent

      - name: Syntax-check Agent sources
        run: |
          find agent -name '*.js' -type f ! -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      # 源码已是 TypeScript，与 npm test 一样经 tsx 加载。
      - name: Import/listen + fake provider smoke
        run: agent/node_modules/.bin/tsx --test agent/tests/listen-smoke.test.js agent/tests/fake-openai-provider.test.js

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend unit tests
        run: npm test --prefix frontend

      - name: Production build
        run: npm run build --prefix frontend

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: |
          # env_file references .env; use the committed template (no real secrets)
          if [ ! -f .env ]; then cp .env.example .env; fi
          docker compose config -q

      - name: Validate production overlay merge
        env:
          DEPLOYMENT_ENV: production
          MYSQL_PASSWORD: ci_mysql_password_0123456789
          MYSQL_ROOT_PASSWORD: ci_mysql_root_password_0123456789
          REDIS_PASSWORD: ci_redis_password_0123456789
          SANDBOX_API_TOKEN: ssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssss
          AGENT_INTERNAL_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SANDBOX_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
          SANDBOX_CORS_ORIGINS: https://app.example.com
          SANDBOX_INTERNAL_HMAC_KEYRING: '{"ci-key":"a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s"}'
          SANDBOX_INTERNAL_HMAC_ACTIVE_KID: ci-key
          EXEC_INTERNAL_ALLOW_CIDR: 10.20.0.0/16
          A2A_PUBLIC_BASE_URL: https://agent.example.com
          A2A_ARTIFACT_DOWNLOAD_SECRET: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          # Production overlay requires a real DBPM (ADR 0011 D10); placeholders only.
          DBPM_URL: dbpm-a.example.internal:7000,dbpm-b.example.internal:7000
          DBPM_DB_NAME: ci_updrdb_entry
          DBPM_REDIS_DB_NAME: ci_redis_entry
          DBPM_REDIS_DB_USER_NAME: ci_redis_user
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
            --format json --output "$RUNNER_TEMP/dsh-enterprise-prod-compose.json"
          python3 scripts/verify_compose_prod_config.py \
            "$RUNNER_TEMP/dsh-enterprise-prod-compose.json"

  cross-service-smoke:
    name: Cross-service smoke (no real LLM key)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: sandbox
          MYSQL_USER: sandbox
          MYSQL_PASSWORD: ci_mysql_password_0123456789
          MYSQL_ROOT_PASSWORD: ci_mysql_root_password_0123456789
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usandbox -pci_mysql_password_0123456789"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
      redis:
        image: redis:5.0.14
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project with test extras
        run: uv sync --extra test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            exec/package-lock.json
            agent/package-lock.json
            api-server/package-lock.json

      - name: Install Node service dependencies
        run: |
          npm ci --prefix contract
          npm ci --prefix exec
          npm ci --prefix agent
          npm ci --prefix api-server

      - name: Build TypeScript services for smoke entrypoints
        run: |
          npm run build --prefix contract
          npm run build --prefix exec
          npm run build --prefix agent

      # docker-compose.yml gives its MySQL `--log-bin-trust-function-creators=1`
      # because Agent migrations create triggers as a non-SUPER application
      # user. A GitHub Actions service container cannot take a command, so do
      # it the other documented way: the platform sets it as root, once, before
      # migrations. Never granted to the app account.
      - name: Allow non-SUPER trigger creation (matches compose mysqld flag)
        run: |
          # Run the client from the same image as the service: the runner image
          # does not reliably ship a mysql client.
          for i in $(seq 1 30); do
            if docker run --rm --network host mysql:5.7 \
                 mysql -h 127.0.0.1 -P 3306 -uroot -pci_mysql_root_password_0123456789 \
                 -e "SET GLOBAL log_bin_trust_function_creators = 1;" 2>/dev/null; then
              echo "log_bin_trust_function_creators=1 set"
              exit 0
            fi
            sleep 2
          done
          echo "could not reach MySQL to set log_bin_trust_function_creators" >&2
          exit 1

      - name: Run cross-service smoke (fake OpenAI provider)
        env:
          SMOKE_MYSQL_URL: mysql://sandbox:ci_mysql_password_0123456789@127.0.0.1:3306/sandbox
          SMOKE_REDIS_URL: redis://127.0.0.1:6379/0
          SMOKE_START_WORKER: "true"
        run: |
          mkdir -p .smoke-tmp
          uv run node scripts/smoke-cross-service.mjs
